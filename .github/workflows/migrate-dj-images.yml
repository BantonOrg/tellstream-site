name: One-time DJ portrait migration to hosted assets

on:
  push:
    branches:
      - feature/hosted-dj-assets-migration-20261125
    paths:
      - .github/workflows/migrate-dj-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-original-dj-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hosted-dj-assets-migration-20261125
          persist-credentials: true
      - name: Download exact original DJ portrait files
        run: |
          python3 - <<'PY'
          import json, re, pathlib, urllib.parse, urllib.request, urllib.error
          base = 'https://vegwferwmyuunwvfqpsf.supabase.co'
          folder = pathlib.Path('src/assets/djs')
          folder.mkdir(parents=True, exist_ok=True)
          js = pathlib.Path('dj-logo-filename-fix.js').read_text()
          mapped_section = re.search(r"const DJ_LOGO_FILES = Object.freeze\\(\\{(.*?)\\}\\);", js, re.S)
          if not mapped_section:
              raise SystemExit('Cannot parse existing DJ filename map')
          mapping = dict(re.findall(r"'([^']+)'\\s*:\\s*'([^']+)'", mapped_section.group(1)))
          files = set(mapping.values()) - {'delete.png'}
          # Include any additional regular schedule presenters using the
          # first two words, exactly like the website.
          original = pathlib.Path('main.original.js').read_text()
          key_match = re.search(r'const SUPABASE_KEY = "([^"]+)"', original)
          if key_match:
              request = urllib.request.Request(
                  base + '/rest/v1/master_schedule?select=dj_name%2Cday_of_week%2Cstart_time',
                  headers={'apikey': key_match.group(1), 'Authorization':'Bearer ' + key_match.group(1)}
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as resp:
                      records = json.load(resp)
                  for row in records:
                      name = str(row.get('dj_name') or '').strip()
                      name = re.sub(r'([a-z0-9])([A-Z])', r'\\1 \\2', name).replace('_', ' ')
                      tokens = name.lower().split()[:2]
                      if not tokens or tokens[0] == 'tellstream':
                          continue
                      stem = '_'.join(tokens)
                      candidate = mapping.get(stem, stem + '.png')
                      if re.fullmatch(r'[a-z0-9_]+\\.png', candidate):
                          files.add(candidate)
              except Exception as exc:
                  print('Schedule list inaccessible, using on-air filename map:', type(exc).__name__)
          copied, missing = 0, []
          for filename in sorted(files):
              if not re.fullmatch(r'[a-z0-9_]+\\.png', filename):
                  raise SystemExit('Unexpected filename ' + filename)
              url = base + '/storage/v1/object/public/dj-logos/' + urllib.parse.quote(filename)
              try:
                  request = urllib.request.Request(url, headers={'User-Agent':'Tellstream-DJ-migration/1.0'})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      content = response.read(10 * 1024 * 1024 + 1)
                  if not content.startswith(b'\\x89PNG\\r\\n\\x1a\\n') or len(content) < 1024 or len(content) > 10 * 1024 * 1024:
                      raise ValueError('Invalid or oversized PNG')
                  (folder / filename).write_bytes(content)
                  copied += 1
                  print('Copied original:', filename, len(content), 'bytes')
              except (urllib.error.URLError, ValueError) as exc:
                  missing.append(filename)
                  print('Not available:', filename, type(exc).__name__)
          print('Copied', copied, 'portrait PNGs; missing', len(missing), missing)
          if copied == 0:
              raise SystemExit('No portraits could be downloaded; leaving files unchanged.')
          PY
      - name: Commit hosted original PNG files to the feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/assets/djs/*.png
          if git diff --staged --quiet; then
            echo "No files to commit"
          else
            git commit -m "Import original presenter PNGs to src/assets/djs/"
            git push origin HEAD:feature/hosted-dj-assets-migration-20261125
          fi
